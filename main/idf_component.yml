## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # Keep the versions already vendored in managed_components. Besides making
  # builds reproducible, this prevents the component manager from silently
  # replacing the known-good LCD stack with newer releases.
  espressif/esp_lcd_st7701: "1.1.4"
  espressif/esp_lcd_panel_io_additions: "1.0.1"
  espressif/esp_io_expander: "1.0.1"
  espressif/cmake_utilities: "0.5.3"
  esp-idf-lib/scd4x: "1.0.8"
  esp-idf-lib/i2cdev: "2.0.8"
  esp-idf-lib/esp_idf_lib_helpers: "1.3.10"
  lvgl/lvgl: "9.4.0"
